[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11.0"
tower-http = { version = "0.7.1", features = ["auth"] }
base16ct = { version = "1.0.0", features = ["alloc"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.23.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "derive", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
rsa = { version = "0.9.10", features = ["pem"] }

# oh yeah mega speed
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
